
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: url("{% static 'image/img1.png' %}") no-repeat center center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            position: relative;
        }

        /* Light Background Tint */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(70, 68, 65, 0.477);
            z-index: 0;
            pointer-events: none;
        }

        .container-fluid {
            position: relative;
            z-index: 1;
        }

        /* Left Section */
        .left-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: transparent;
            color: #fff;
        }

        .content {
            max-width: 450px;
        }

        .content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 65px;
            font-weight: 800;
            line-height: 1.15;
            color: #f4d7a1;
            margin-bottom: 20px;
            text-shadow: 2px 3px 12px rgba(0, 0, 0, 0.45);
        }

        .content p {
            color: #fff;
            font-size: 17px;
            line-height: 1.8;
            text-shadow: 1px 2px 8px rgba(0, 0, 0, 0.65);
        }

        /* Right Section */
        .login-wrapper {
            min-height: 100vh;
            padding: 30px;
            background: transparent;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(218, 178, 126, 0.55);
            border-radius: 24px;
            background: linear-gradient(
                145deg,
                #fffaf4,
                #f5e9df
            );
            box-shadow: 0 25px 70px rgba(25, 5, 15, 0.35);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(25, 5, 15, 0.42);
        }

        .card-body {
            padding: 45px !important;
        }

        /* Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .owner-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: block;
        }

        /* Heading */
        .login-card h2 {
            font-family: 'Playfair Display', serif;
            color: #5b102d;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .login-card p {
            color: #806b70 !important;
            font-size: 14px;
        }

        /* Labels */
        .form-label {
            color: #57132e;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 9px;
        }

        /* Input Fields */
        .form-control {
            height: 54px;
            border: 1px solid #dfc9bd;
            border-radius: 12px;
            background: #fffdfb;
            padding: 12px 16px;
            font-size: 14px;
            color: #381323;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #b09b9b;
        }

        .form-control:focus {
            background: #fff;
            border-color: #8c234c;
            box-shadow: 0 0 0 4px rgba(140, 35, 76, 0.12);
        }

        /* Login Button */
        .btn-login {
            height: 55px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #64112f,
                #a52d55
            );
            color: #fff4e8;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(100, 17, 47, 0.25);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: linear-gradient(
                135deg,
                #790f38,
                #2e0a17
            );
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(100, 17, 47, 0.35);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Error Alert */
        .alert-danger {
            border: 1px solid #e8b9bd;
            border-radius: 10px;
            background: #fff0f0;
            color: #a3263b;
            font-size: 14px;
        }

        /* Register Link */
        .register-link {
            color: #b70e5d;
            font-weight: 800;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .register-link:hover {
            color: #3f091e;
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 576px) {
            body {
                background-attachment: scroll;
            }

            .login-wrapper {
                padding: 18px;
            }

            .login-card {
                max-width: 100%;
                border-radius: 19px;
            }

            .card-body {
                padding: 30px 24px !important;
            }

            .owner-logo {
                width: 125px;
                height: 125px;
            }

            .login-card h2 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- Left Side -->
        <div class="col-lg-6 d-none d-lg-flex left-section">
            <div class="content">
                <h1>Welcome Back</h1>
                <p>
                    Manage your clothing store with confidence.
                    Sign in to access your owner dashboard and
                    keep your business moving forward.
                </p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="col-lg-6 col-md-12 d-flex justify-content-center align-items-center login-wrapper">

            <div class="card login-card">

                <div class="card-body">

                    <!-- Website Logo -->
                    <div class="logo-container">
                        <img src="{% static 'images/logo2.png' %}"
                             alt="Website Logo"
                             class="owner-logo">
                    </div>

                    <h2 class="text-center mb-2">Owner Login</h2>

                    <p class="text-center mb-4">
                        Sign in to your account
                    </p>

                    {% if error %}
                    <div class="alert alert-danger" id="error-alert">
                        {{ error }}
                    </div>
                    {% endif %}

                    <!-- Login Form -->
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input
                                type="text"
                                class="form-control"
                                name="username"
                                placeholder="Enter Username"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                placeholder="Enter Password"
                                required>
                        </div>

                        <button type="submit" class="btn btn-login w-100">
                            LOGIN
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span style="color: #806b70;">
                            Don't have an account?
                        </span>
                        <a href="{% url 'owner_register' %}" class="register-link">
                            Register
                        </a>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<!-- Error Message: Hide after 5 seconds -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const alertBox = document.getElementById("error-alert");

    if (alertBox) {
        setTimeout(function () {
            alertBox.style.display = "none";
        }, 5000);
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
