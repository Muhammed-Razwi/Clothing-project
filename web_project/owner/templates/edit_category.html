```html
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Category</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .edit-card {
            max-width: 500px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #172554;
            font-weight: bold;
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
        }

        .btn-update {
            background-color: #172554;
            color: white;
            height: 45px;
        }

        .btn-update:hover {
            background-color: #263b79;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="edit-card">

        <h2 class="mb-2">Edit Category</h2>

        <p class="text-muted mb-4">
            Update your clothing category.
        </p>

        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Edit Form -->
        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label for="category_name" class="form-label">
                    Category Name
                </label>

                <input
                    type="text"
                    name="category_name"
                    id="category_name"
                    class="form-control"
                    value="{{ item.category_name }}"
                    placeholder="Enter category name"
                    maxlength="100"
                    required
                >

            </div>

            <button type="submit"
                    class="btn btn-update w-100 mb-3">
                Update Category
            </button>

            <a href="{% url 'owner_dashboard' %}"
               class="btn btn-outline-secondary w-100">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
```
