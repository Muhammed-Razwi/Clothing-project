
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Registration | Fashion Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #F4F1EB;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        /* Main Container */

        .register-container {
            width: 100%;
            max-width: 1100px;
            min-height: 720px;
            background: #FFFEFA;
            border-radius: 22px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
        }

        /* Left Logo Section */

        .welcome-section {
            background: #344438;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            min-height: 720px;
        }

        .logo-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .large-logo {
            width: 100%;
            max-width: 350px;
            height: 350px;
            object-fit: contain;
            display: block;
        }

        /* Right Registration Section */

        .form-section {
            padding: 55px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-heading {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: #344438;
            margin-bottom: 8px;
        }

        .form-subheading {
            color: #88877F;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #344438;
            margin-bottom: 7px;
        }

        .form-control {
            height: 48px;
            border: 1px solid #DEDCD4;
            border-radius: 9px;
            background: #FFFEFA;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 17px;
            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: #344438;
            background: #FFFFFF;
        }

        .register-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 9px;
            background: #344438;
            color: white;
            font-size: 15px;
            font-weight: 600;
            margin-top: 8px;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #26352A;
            transform: translateY(-2px);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #77766F;
        }

        .login-text a {
            color: #344438;
            font-weight: 700;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 13px;
            border-radius: 8px;
        }

        /* Tablet Responsive */

        @media (max-width: 991px) {
            .register-container {
                grid-template-columns: 1fr;
                max-width: 600px;
            }

            .welcome-section {
                min-height: 350px;
                padding: 30px;
            }

            .large-logo {
                max-width: 280px;
                height: 280px;
            }

            .form-section {
                padding: 45px 40px;
            }
        }

        /* Mobile Responsive */

        @media (max-width: 576px) {
            body {
                padding: 15px;
            }

            .register-container {
                border-radius: 15px;
            }

            .welcome-section {
                min-height: 260px;
                padding: 20px;
            }

            .large-logo {
                max-width: 210px;
                height: 210px;
            }

            .form-section {
                padding: 35px 25px;
            }

            .form-heading {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- LEFT SECTION: LOGO ONLY -->

        <div class="welcome-section">
            <div class="logo-wrapper">
                <img src="{% static 'images/logo1.png' %}"
                     alt="Fashion Store Logo"
                     class="large-logo">
            </div>
        </div>

        <!-- RIGHT SECTION: OWNER REGISTRATION FORM -->

        <div class="form-section">

            <h1 class="form-heading">Owner Registration</h1>

            <p class="form-subheading">
                Create your owner account.
            </p>

            <!-- Django Messages -->

            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success">
                    {{ success }}
                </div>
            {% endif %}

            <!-- Owner Registration Form -->

            <form method="POST" action="">
                {% csrf_token %}

                <label class="form-label">Full Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter your full name"
                       value="{{ request.POST.name|default:'' }}"
                       required>

                <label class="form-label">Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Choose a username"
                       value="{{ request.POST.username|default:'' }}"
                       required>

                <label class="form-label">Email Address</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter your email"
                       value="{{ request.POST.email|default:'' }}"
                       required>

                <label class="form-label">Phone Number</label>
                <input type="tel"
                       name="phone"
                       class="form-control"
                       placeholder="Enter your phone number"
                       value="{{ request.POST.phone|default:'' }}"
                       required>

                <label class="form-label">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Create a password"
                       required>

                <button type="submit" class="register-btn">
                    Create Owner Account
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="{% url 'owner_login' %}">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
