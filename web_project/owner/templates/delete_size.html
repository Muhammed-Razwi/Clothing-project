
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Delete Size</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .delete-card {
            max-width: 450px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="delete-card">

        <h2 class="text-danger mb-3">Delete Size</h2>

        <p>
            Are you sure you want to delete this size?
        </p>

        <h4 class="mb-4">
            {{ size_item.size_name }}
        </h4>

        <form method="POST"
              action="{% url 'delete_size' size_item.id %}">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger w-100">
                Yes, Delete
            </button>
        </form>

        <a href="{% url 'owner_dashboard' %}"
           class="btn btn-secondary w-100 mt-2">
            Cancel
        </a>

    </div>

</div>

</body>
</html>
