<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Size</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #102b25, #183c32, #0c211d);
            font-family: 'Inter', sans-serif;
            color: #e9e2d5;
        }

        .form-card {
            width: 100%;
            max-width: 480px;
            padding: 45px 40px;
            background: #fffdf8;
            border: 1px solid #c8aa78;
            border-radius: 8px;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.28);
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #a17a43, #e2c58e, #a17a43);
        }

        .brand-label {
            text-align: center;
            color: #a17a43;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #17382e;
            font-size: 34px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999184;
            text-align: center;
            font-size: 12px;
            margin-bottom: 35px;
        }

        .heading-line {
            width: 45px;
            height: 2px;
            background: #c29b62;
            margin: 18px auto 28px;
        }

        .form-label {
            color: #42574c;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.4px;
        }

        .form-control {
            min-height: 52px;
            padding: 13px 15px;
            border: 1px solid #e4ddcf;
            border-radius: 5px;
            background: #faf8f2;
            color: #263b30;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: #b28b53;
            box-shadow: 0 0 0 3px rgba(178, 139, 83, 0.13);
        }

        .btn-update {
            min-height: 52px;
            background: #17382e;
            color: #f5e9d2;
            border: 1px solid #17382e;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-update:hover {
            background: #285344;
            color: #ffffff;
            border-color: #285344;
            transform: translateY(-2px);
        }

        .btn-cancel {
            min-height: 49px;
            background: transparent;
            color: #6c624f;
            border: 1px solid #d8cbb8;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-cancel:hover {
            background: #eee8dc;
            color: #17382e;
            border-color: #c4ad8a;
        }

        .alert {
            border-radius: 5px;
            font-size: 13px;
        }

        .footer-text {
            color: #aaa08f;
            text-align: center;
            font-size: 10px;
            letter-spacing: 1.5px;
            margin-top: 28px;
            margin-bottom: 0;
            text-transform: uppercase;

        @media (max-width: 576px) {
            .form-card {
                padding: 35px 23px;
            }

            h2 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <div class="brand-label">Premium Collection</div>

        <h2>Edit Size</h2>

        <p class="subtitle">
            Update your clothing size information.
        </p>

        <div class="heading-line"></div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close"
                            data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label for="size_name" class="form-label">
                    SIZE NAME
                </label>

                <input
                    type="text"
                    name="size_name"
                    id="size_name"
                    class="form-control"
                    value="{{ size_item.size_name }}"
                    maxlength="20"
                    placeholder="Enter size name"
                    required
                >
            </div>

            <button type="submit" class="btn btn-update w-100">
                Update Size
            </button>

            <a href="{% url 'owner_dashboard' %}"
               class="btn btn-cancel w-100 mt-3 d-flex align-items-center justify-content-center">
                Cancel
            </a>

        </form>

        <p class="footer-text">Elegant Style · Premium Quality</p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
